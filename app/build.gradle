plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.yazdandoost.goldgallery'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.yazdandoost.goldgallery'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty("vcode") ?: "1").toString())
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../gold-gallery.keystore')
            storePassword 'goldgallery123'
            keyAlias 'goldgallery'
            keyPassword 'goldgallery123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}
